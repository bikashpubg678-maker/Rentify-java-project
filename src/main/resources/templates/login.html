<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout('Sign in', ~{::content})}">
<body>
<div th:fragment="content">

    <div class="page-header">
        <h1 class="page-title">Sign in</h1>
        <p class="page-sub">Use your Google account to access Rentify</p>
    </div>

    <div class="card" style="max-width:420px;margin:0 auto;">
        <div class="card-body" style="text-align:center;padding:32px 24px;">

            <div th:if="${error}" class="badge rented" style="margin-bottom:16px;display:inline-block;">
                Sign-in failed. Please try again.
            </div>

            <p style="margin:0 0 24px 0;color:var(--text-muted,#6b7280);">
                You'll be redirected to Google to verify your account,
                then sent back to the dashboard.
            </p>

            <a href="/oauth2/authorization/google"
               class="btn btn-primary"
               style="display:inline-flex;align-items:center;gap:10px;padding:12px 20px;font-size:16px;">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 48 48">
                    <path fill="#FFC107" d="M43.611 20.083H42V20H24v8h11.303C33.834 32.91 29.32 36 24 36c-6.627 0-12-5.373-12-12s5.373-12 12-12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 12.955 4 4 12.955 4 24s8.955 20 20 20 20-8.955 20-20c0-1.341-.138-2.65-.389-3.917z"/>
                    <path fill="#FF3D00" d="M6.306 14.691l6.571 4.819C14.655 15.108 18.961 12 24 12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 16.318 4 9.656 8.337 6.306 14.691z"/>
                    <path fill="#4CAF50" d="M24 44c5.166 0 9.86-1.977 13.409-5.197l-6.19-5.238C29.211 35.091 26.715 36 24 36c-5.299 0-9.799-3.069-11.291-7.945l-6.522 5.025C9.505 39.556 16.227 44 24 44z"/>
                    <path fill="#1976D2" d="M43.611 20.083H42V20H24v8h11.303a12.043 12.043 0 0 1-4.087 5.565l.003-.002 6.19 5.238C36.971 39.205 44 34 44 24c0-1.341-.138-2.65-.389-3.917z"/>
                </svg>
                Continue with Google
            </a>

        </div>
    </div>

</div>
</body>
</html>
