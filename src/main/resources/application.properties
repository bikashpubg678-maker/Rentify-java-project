spring.application.name=Rentify


spring.datasource.url=jdbc:h2:mem:autorentdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.thymeleaf.cache=false
spring.jpa.open-in-view=false
server.port=${PORT:8081}
server.address=0.0.0.0

# Mobile JWT config — override RENTIFY_JWT_SECRET in production deploys.
rentify.jwt.secret=${RENTIFY_JWT_SECRET:CHANGE-ME-rentify-default-secret-please-override-32bytes!!}
rentify.jwt.ttl-millis=${RENTIFY_JWT_TTL_MS:2592000000}
# Google OAuth2 login
# Set GOOGLE_CLIENT_ID and GOOGLE_CLIENT_SECRET in your environment.
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,email,profile
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/google
